name: ci

# Build gate for the standalone SigmaVoice app. Validates that the app
# typechecks and bundles against the SigmaLink voice engine pulled in via the
# `sigmalink/` git submodule. Does NOT build native binaries or package an
# installer (that is release.yml's job) — esbuild keeps the natives external, so
# this gate runs without compiling whisper.cpp.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: typecheck + bundle
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout (with SigmaLink submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 24: needed so `pnpm test` can run the .ts test files directly via
      # Node's built-in test runner + native TypeScript type-stripping (stable,
      # unflagged, since Node 23.6). The esbuild bundle still targets Electron's
      # Node 20 runtime — this is only the toolchain Node for typecheck/test/build.
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install engine (link deps from ./sigmalink; skip native postinstall)
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (node:test — app-shell pure modules)
        run: pnpm test

      - name: Bundle (esbuild — natives external)
        run: pnpm build
