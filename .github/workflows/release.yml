name: release

# Produces the standalone SigmaVoice installers (macOS DMG arm64, Windows NSIS
# x64), unsigned/ad-hoc, on a `v*` tag. The shared voice engine + natives come
# from the SigmaLink git submodule; the natives are compiled against Electron's
# ABI with node-gyp (single-arch per platform — no cross-compile), then
# electron-builder packages them with npmRebuild:false (copy, don't recompile).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS — unsigned ad-hoc DMG (arm64)
  # ---------------------------------------------------------------------------
  build-macos:
    name: build macos installer
    runs-on: macos-14            # Apple Silicon → native arm64 build
    timeout-minutes: 40
    steps:
      - name: Checkout (with SigmaLink submodule, recursive for whisper.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 24: release runs the same app-shell test gate as ci.yml, whose
      # .ts test files rely on Node's built-in TypeScript type-stripping.
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

      # --- Build the shared natives for Electron's ABI inside the submodule. ---
      - name: Install engine deps (submodule)
        working-directory: sigmalink/app
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        env:
          npm_config_build_from_source: 'false'

      - name: Build voice-mac (arm64, Electron ABI)
        working-directory: sigmalink/app/native/voice-mac
        run: npx node-gyp rebuild --target=30.5.1 --arch=arm64 --dist-url=https://electronjs.org/headers

      - name: Build voice-whisper (arm64, Electron ABI)
        working-directory: sigmalink/app/native/voice-whisper
        env:
          GGML_METAL: 1
        run: npx node-gyp rebuild --target=30.5.1 --arch=arm64 --dist-url=https://electronjs.org/headers

      - name: Verify natives landed
        working-directory: sigmalink/app
        run: |
          test -f native/voice-mac/build/Release/sigmavoice_mac.node && echo "voice-mac OK"
          test -f native/voice-whisper/build/Release/whisper_bridge.node && echo "voice-whisper OK"

      # --- Bundle + package the app at the repo root (link: into the submodule). ---
      - name: Install app deps (link deps from ./sigmalink; skip native postinstall)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck app shell
        run: pnpm typecheck

      - name: Test app shell
        run: pnpm test

      - name: Bundle app shell (main + preloads)
        run: node scripts/build.cjs

      - name: Build macOS DMG (ad-hoc signed, unnotarized)
        run: pnpm exec electron-builder --mac --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate macOS SHA256SUMS
        shell: bash
        run: |
          cd release
          shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt

      - name: Upload macOS installer artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sigmavoice-macos-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/latest-mac.yml
            release/SHA256SUMS-macos.txt

      - name: Attach macOS installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/latest-mac.yml
            release/SHA256SUMS-macos.txt
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Windows — unsigned NSIS installer (x64)
  # ---------------------------------------------------------------------------
  build-windows:
    name: build windows installer
    # Pin native packaging to VS 2022. windows-latest can expose newer Visual
    # Studio images before node-gyp recognizes their version metadata.
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Checkout (with SigmaLink submodule, recursive for whisper.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Node 24: release runs the same app-shell test gate as ci.yml, whose
      # .ts test files rely on Node's built-in TypeScript type-stripping.
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Install engine deps (submodule)
        working-directory: sigmalink/app
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        env:
          npm_config_build_from_source: 'false'

      - name: Build voice-win (x64, Electron ABI)
        working-directory: sigmalink/app/native/voice-win
        run: npx node-gyp rebuild --target=30.5.1 --arch=x64 --dist-url=https://electronjs.org/headers

      - name: Build voice-whisper (x64, Electron ABI)
        working-directory: sigmalink/app/native/voice-whisper
        run: npx node-gyp rebuild --target=30.5.1 --arch=x64 --dist-url=https://electronjs.org/headers

      - name: Verify natives landed
        working-directory: sigmalink/app
        shell: bash
        run: |
          test -f native/voice-win/build/Release/sigmavoice_win.node && echo "voice-win OK"
          test -f native/voice-whisper/build/Release/whisper_bridge.node && echo "voice-whisper OK"

      - name: Install app deps (link deps from ./sigmalink; skip native postinstall)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck app shell
        run: pnpm typecheck

      - name: Test app shell
        run: pnpm test

      - name: Bundle app shell (main + preloads)
        run: node scripts/build.cjs

      - name: Build Windows NSIS installer (unsigned)
        run: pnpm exec electron-builder --win nsis --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate Windows SHA256SUMS
        shell: bash
        run: |
          cd release
          sha256sum *.exe > SHA256SUMS-windows.txt

      - name: Upload Windows installer artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sigmavoice-windows-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt

      - name: Attach Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt
          fail_on_unmatched_files: true
