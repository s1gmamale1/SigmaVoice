name: release

# ⚠️ DRAFT — NOT YET VALIDATED ON GITHUB RUNNERS.
# This produces the standalone SigmaVoice installers, building the shared voice
# natives from the SigmaLink submodule. The multi-arch native build (whisper.cpp
# for both arm64 + x64) is the open item and must be validated on a real run
# before relying on it. Until then, SigmaLink's `release-sigma-voice.yml` remains
# the proven release path. Trigger is `v*` tags on THIS repo.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # macOS — unsigned ad-hoc DMG (arm64 + x64)
  # ---------------------------------------------------------------------------
  build-macos:
    name: build macos installer
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: Checkout (with SigmaLink submodule, recursive for whisper.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # --- Build the shared natives for Electron's ABI inside the submodule. ---
      - name: Install engine deps (submodule)
        working-directory: sigmalink/app
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        env:
          npm_config_build_from_source: 'false'

      - name: Install Electron binary (for the ABI target)
        working-directory: sigmalink/app
        run: node node_modules/electron/install.js

      - name: Rebuild voice natives for Electron (mac + whisper)
        working-directory: sigmalink/app
        env:
          GGML_METAL: 1
        run: npx @electron/rebuild -f -w sigmavoice_mac -w whisper_bridge

      - name: Verify whisper native landed
        working-directory: sigmalink/app
        run: |
          if [ -f "native/voice-whisper/build/Release/whisper_bridge.node" ]; then
            echo "voice-whisper native binary found"
          else
            echo "WARNING: voice-whisper binary not found — fell back to stub"
          fi

      # --- Bundle + package the app at the repo root (link: into the submodule). ---
      - name: Install app + bundle (main + preloads)
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          node scripts/build.cjs

      - name: Build macOS DMG (ad-hoc signed, unnotarized)
        run: pnpm exec electron-builder --mac --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS installer artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sigmavoice-macos-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/latest-mac.yml

      - name: Attach macOS installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/latest-mac.yml
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # Windows — unsigned NSIS installer (x64)
  # ---------------------------------------------------------------------------
  build-windows:
    name: build windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (with SigmaLink submodule, recursive for whisper.cpp)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install engine deps (submodule)
        working-directory: sigmalink/app
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        env:
          npm_config_build_from_source: 'false'

      - name: Install Electron binary (for the ABI target)
        working-directory: sigmalink/app
        run: node node_modules/electron/install.js

      - name: Rebuild voice natives for Electron (win + whisper)
        working-directory: sigmalink/app
        run: npx @electron/rebuild -f -w sigmavoice_win -w whisper_bridge
        continue-on-error: true

      - name: Install app + bundle (main + preloads)
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          node scripts/build.cjs

      - name: Build Windows NSIS installer (unsigned)
        run: pnpm exec electron-builder --win nsis --config electron-builder.yml --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows installer artefacts
        uses: actions/upload-artifact@v4
        with:
          name: sigmavoice-windows-installer
          if-no-files-found: error
          retention-days: 30
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml

      - name: Attach Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
