<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SigmaVoice HUD</title>
  <style>
    /*
     * Self-contained recording HUD overlay. No frameworks, no external assets.
     * Rendered into a transparent, click-through-feel BrowserWindow. The body
     * itself is transparent; only the pill is painted.
     */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;        /* let the transparent window show through */
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      /* Don't let the overlay capture text selection / drag. */
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      /* Small inset so the pill's shadow isn't clipped by the window edge. */
      padding: 6px;
    }

    /* --- the glassy pill --- */
    .pill {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      height: 100%;
      padding: 0 14px;
      border-radius: 16px;
      /* Dark glass: translucent backing + blur + hairline highlight. */
      background: rgba(28, 28, 30, 0.72);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      backdrop-filter: blur(22px) saturate(160%);
      border: 0.5px solid rgba(255, 255, 255, 0.14);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.45),
        inset 0 0.5px 0 rgba(255, 255, 255, 0.18);
      color: #f2f2f7;
      /* Entrance animation. A CSS linear() spring approximation (a gentle
       * over-shoot + settle) instead of a cubic-bezier — feels alive without
       * a JS spring. Samples below trace a lightly-damped spring response. */
      animation: hud-in 420ms linear(
        0, 0.012, 0.094, 0.262, 0.487, 0.718, 0.901, 1.018,
        1.07, 1.069, 1.038, 1.0, 0.984, 0.989, 0.998, 1.001, 1) both;
    }

    @keyframes hud-in {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* --- recording indicator: pulsing red dot --- */
    .indicator {
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff453a;            /* systemRed (dark) */
      box-shadow: 0 0 6px rgba(255, 69, 58, 0.8);
      animation: dot-pulse 1.4s ease-in-out infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1;    transform: scale(1); }
      50%      { opacity: 0.45; transform: scale(0.78); }
    }

    /* Transcribing: swap the dot for a thin rotating spinner ring. */
    .pill[data-state="transcribing"] .dot { display: none; }
    .spinner {
      display: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.22);
      border-top-color: #0a84ff;     /* systemBlue (dark) */
      animation: spin 0.8s linear infinite;
    }
    .pill[data-state="transcribing"] .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* --- HONEST 'listening' indicator ---
     * NOT an audio-level meter. A single calm, breathing waveform glyph that
     * indicates "I'm listening" WITHOUT pretending to track your voice level.
     * It's an indeterminate state cue, like a spinner — never claims to know
     * how loud you are. (Replaces the old fake equalizer, which bounced even
     * during silence — a lie about what the app could hear.) */
    .wave {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 22px;
      color: #0a84ff;                 /* systemBlue (dark) */
    }
    .wave svg {
      width: 100%;
      height: 16px;
      display: block;
      overflow: visible;
    }
    .wave path {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      /* Calm breathing: the whole glyph gently swells/fades on a slow cycle.
       * It does NOT deform per-amplitude — there is nothing dishonest here. */
      transform-origin: center;
      animation: wave-breathe 2.4s ease-in-out infinite;
    }
    @keyframes wave-breathe {
      0%, 100% { opacity: 0.55; transform: scaleY(0.82); }
      50%      { opacity: 1;    transform: scaleY(1.08); }
    }

    /* Transcribing: still the breathing, dim to a flat neutral line — work is
     * happening downstream, not at the mic. */
    .pill[data-state="transcribing"] .wave {
      color: rgba(255, 255, 255, 0.4);
    }
    .pill[data-state="transcribing"] .wave path {
      animation: wave-shimmer 1.6s ease-in-out infinite;
    }
    @keyframes wave-shimmer {
      0%, 100% { opacity: 0.35; }
      50%      { opacity: 0.7; }
    }

    /* --- icon glyph (error ⚠ / done ✓), hidden in normal states --- */
    .glyph {
      display: none;
      flex: 0 0 auto;
      font-size: 14px;
      line-height: 1;
    }

    /* === ERROR: mic unavailable === */
    .pill[data-state="error"] .dot,
    .pill[data-state="error"] .spinner,
    .pill[data-state="error"] .wave,
    .pill[data-state="error"] .timer { display: none; }
    .pill[data-state="error"] .indicator .glyph {
      display: block;
      color: #ff453a;                 /* systemRed (dark) */
    }
    .pill[data-state="error"] .label {
      display: block;
      color: #ff453a;
    }

    /* === NO-INPUT: capture running, nothing arriving (dimmed hint) === */
    .pill[data-state="no-input"] .dot {
      /* keep the recording context but desaturate + calm it */
      background: #8e8e93;            /* systemGray */
      box-shadow: none;
      animation: dot-pulse 2.2s ease-in-out infinite;
    }
    .pill[data-state="no-input"] .wave { color: rgba(255, 255, 255, 0.22); }
    .pill[data-state="no-input"] .timer { color: #8e8e93; }
    .pill[data-state="no-input"] .label {
      display: block;
      color: #aeaeb2;
    }

    /* === DONE: brief success check flash === */
    .pill[data-state="done"] .dot,
    .pill[data-state="done"] .spinner,
    .pill[data-state="done"] .wave,
    .pill[data-state="done"] .timer { display: none; }
    .pill[data-state="done"] .indicator .glyph {
      display: block;
      color: #30d158;                 /* systemGreen (dark) */
      animation: done-flash 600ms ease-out both;
    }
    @keyframes done-flash {
      0%   { opacity: 0; transform: scale(0.6); }
      40%  { opacity: 1; transform: scale(1.15); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Inline status label (shown only in error / no-input states). */
    .label {
      display: none;
      flex: 1 1 auto;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2px;
      text-align: center;
    }

    /* Visually-hidden live region — announces state to screen readers without
     * occupying layout. (The visual elements are aria-hidden.) */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* --- timer --- */
    .timer {
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #f2f2f7;
      min-width: 42px;
      text-align: right;
    }
    /* In transcribing, the timer is frozen; dim it + show a label cue. */
    .pill[data-state="transcribing"] .timer { color: #aeaeb2; }

    /* === IDLE: resting floating pill (mic glyph + optional wordmark) === */
    .mic { display: none; flex: 0 0 auto; }
    .wordmark {
      display: none; flex: 1 1 auto; font-size: 13px; font-weight: 600;
      letter-spacing: 0.2px; color: #f2f2f7; white-space: nowrap;
    }
    .pill[data-state="idle"] .dot,
    .pill[data-state="idle"] .spinner,
    .pill[data-state="idle"] .wave,
    .pill[data-state="idle"] .timer,
    .pill[data-state="idle"] .label { display: none; }
    .pill[data-state="idle"] .mic { display: block; color: #f2f2f7; }
    .pill[data-state="idle"].appearance-full .wordmark { display: block; }
    /* Compact idle: center just the mic glyph. */
    .pill.appearance-compact[data-state="idle"] { justify-content: center; }
    /* The pill is interactive (click-to-dictate / drag) — show it. */
    .pill { cursor: pointer; }
    .pill.dragging { cursor: grabbing; }

    /* --- reduced motion: kill all animation, keep states legible --- */
    @media (prefers-reduced-motion: reduce) {
      .pill { animation: none; }
      .dot { animation: none; }
      .spinner { animation: none; }
      /* Freeze the breathing waveform at a calm, static mid-state. */
      .wave path { animation: none !important; opacity: 0.85; transform: none; }
      .pill[data-state="done"] .indicator .glyph { animation: none; }
    }
  </style>
</head>
<body>
  <!-- Default markup renders the 'recording' state so the HUD is visible even
       if no preload / no state event ever arrives (fail-visible). -->
  <div class="pill appearance-full" id="pill" data-state="idle" role="status">
    <div class="indicator">
      <div class="dot" aria-hidden="true"></div>
      <div class="spinner" aria-hidden="true"></div>
      <!-- ⚠ in 'error', ✓ in 'done'; CSS picks which (if any) is shown. -->
      <span class="glyph" id="glyph" aria-hidden="true">&#9888;</span>
      <!-- idle: a calm mic glyph (the resting floating-pill state). -->
      <svg class="mic" viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
        <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z" />
        <path d="M17 11a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" />
      </svg>
    </div>
    <!-- idle wordmark (shown only in the 'full' appearance). -->
    <div class="wordmark" id="wordmark" aria-hidden="true">SigmaVoice</div>
    <!-- HONEST 'listening' glyph: a calm breathing waveform, NOT a level meter. -->
    <div class="wave" aria-hidden="true">
      <svg viewBox="0 0 64 16" preserveAspectRatio="none" role="presentation">
        <path d="M2 8 Q8 8 11 4 T20 8 T29 8 T38 12 T47 8 T56 4 T62 8" />
      </svg>
    </div>
    <!-- Inline status text for error / no-input (CSS toggles visibility). -->
    <div class="label" id="label" aria-hidden="true"></div>
    <div class="timer" id="timer" aria-label="Elapsed time">00:00</div>
    <!-- Live region: applyState() sets textContent per state for screen readers. -->
    <span class="sr-only" id="srStatus" aria-live="polite">SigmaVoice</span>
  </div>

  <script type="module">
    // -----------------------------------------------------------------------
    // Contract assumed from the HUD preload (the lead exposes EXACTLY this):
    //   window.sigmaHud.onState((payload) => { ... })
    //   payload = { state: 'recording' | 'transcribing'
    //                     | 'error' | 'no-input' | 'done' }
    // The last three are render-ready for future engine signals; the controller
    // only emits 'recording'/'transcribing' today. If window.sigmaHud is missing
    // we leave the static 'recording' markup in place so the overlay still shows
    // something useful.
    // -----------------------------------------------------------------------

    const STATES = ['idle', 'recording', 'transcribing', 'error', 'no-input', 'done'];

    // Screen-reader announcement per state (matches the visual semantics).
    const SR_LABEL = {
      'idle': 'SigmaVoice — click to dictate',
      'recording': 'Recording',
      'transcribing': 'Transcribing…',
      'error': 'Mic unavailable',
      'no-input': 'No input',
      'done': 'Done',
    };

    const WARN = '⚠'; // ⚠ error
    const CHECK = '✓'; // ✓ done

    const pill = document.getElementById('pill');
    const timerEl = document.getElementById('timer');
    const labelEl = document.getElementById('label');
    const glyphEl = document.getElementById('glyph');
    const srStatus = document.getElementById('srStatus');

    // --- elapsed timer (owned entirely by the renderer) ---
    // The display has 1-second granularity, so a 60fps rAF loop is wasteful.
    // Poll a few times a second and only touch the DOM when the whole-second
    // value actually changes (tracked via lastSec).
    let startMs = 0;
    let intervalId = 0;
    let lastSec = -1;

    function fmt(totalSeconds) {
      const s = Math.max(0, Math.floor(totalSeconds));
      const mm = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      return mm + ':' + ss;
    }

    function tick() {
      const sec = Math.max(0, Math.floor((performance.now() - startMs) / 1000));
      if (sec !== lastSec) {
        lastSec = sec;
        timerEl.textContent = fmt(sec);
      }
    }

    function startTimer() {
      stopTimer();
      startMs = performance.now();
      lastSec = 0;
      timerEl.textContent = '00:00';
      intervalId = setInterval(tick, 250);
    }

    function stopTimer() {
      if (intervalId) {
        clearInterval(intervalId);
        intervalId = 0;
      }
      // Leave the last value displayed (frozen) — do NOT reset to 00:00.
    }

    function applyState(state, appearance) {
      if (!STATES.includes(state)) return;
      pill.style.display = '';
      pill.setAttribute('data-state', state);
      // Appearance: 'compact' = logo only, 'full' (default) = logo + wordmark.
      const compact = appearance === 'compact';
      pill.classList.toggle('appearance-compact', compact);
      pill.classList.toggle('appearance-full', !compact);
      // Always announce the new state to screen readers (visuals are aria-hidden).
      srStatus.textContent = SR_LABEL[state];

      switch (state) {
        case 'idle':
          // Resting floating pill: no timer, no capture indicators.
          labelEl.textContent = '';
          stopTimer();
          break;
        case 'recording':
          // Live recording: run the elapsed timer; honest breathing waveform.
          labelEl.textContent = '';
          startTimer();
          break;
        case 'transcribing':
          // Work moved downstream — freeze the elapsed time, calm the waveform.
          labelEl.textContent = '';
          stopTimer();
          break;
        case 'error':
          // Mic unavailable: ⚠ + inline red label, no timer.
          stopTimer();
          glyphEl.textContent = WARN;
          labelEl.textContent = 'Mic unavailable';
          break;
        case 'no-input':
          // Capture running but nothing arriving: dimmed hint alongside the timer.
          labelEl.textContent = 'No input — check your mic';
          break;
        case 'done':
          // Brief success check before the overlay hides.
          stopTimer();
          glyphEl.textContent = CHECK;
          labelEl.textContent = '';
          break;
      }
    }

    // Click-to-dictate + drag-to-move (floating pill). The window is
    // focusable:false, so these mouse interactions NEVER steal keyboard focus
    // from the app you're dictating into. A small movement threshold tells a
    // click (toggle dictation) apart from a drag (reposition + persist). Because
    // the window follows the cursor, the grab offset (clientX/Y) stays constant,
    // so the new top-left is simply screen − grab.
    const DRAG_THRESHOLD = 4;
    let pressing = false, dragging = false;
    let grabX = 0, grabY = 0, downScreenX = 0, downScreenY = 0;

    pill.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      pressing = true; dragging = false;
      grabX = e.clientX; grabY = e.clientY;
      downScreenX = e.screenX; downScreenY = e.screenY;
    });
    window.addEventListener('mousemove', (e) => {
      if (!pressing) return;
      const dx = e.screenX - downScreenX, dy = e.screenY - downScreenY;
      if (!dragging && Math.hypot(dx, dy) > DRAG_THRESHOLD) {
        dragging = true;
        pill.classList.add('dragging');
      }
      if (dragging) window.sigmaHud?.move(e.screenX - grabX, e.screenY - grabY);
    });
    window.addEventListener('mouseup', (e) => {
      if (!pressing) return;
      pressing = false;
      if (dragging) {
        dragging = false;
        pill.classList.remove('dragging');
        window.sigmaHud?.moveEnd(e.screenX - grabX, e.screenY - grabY);
      } else {
        window.sigmaHud?.toggle();
      }
    });

    // When the BrowserWindow is hidden (e.g. recording → idle, which sends no
    // state event) the renderer's document becomes hidden — stop the interval so
    // it doesn't keep ticking in a hidden window.
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopTimer();
    });

    // Wire up the preload bridge if present; otherwise stay on static markup.
    const hud = window.sigmaHud;
    if (hud && typeof hud.onState === 'function') {
      hud.onState((payload) => {
        if (payload && STATES.includes(payload.state)) {
          applyState(payload.state, payload.appearance);
        }
      });
    } else {
      // Fail-visible: render the static 'recording' state and run the timer so
      // the overlay is obviously alive even without the bridge.
      applyState('recording');
    }
  </script>
</body>
</html>
